services:
  bookhaven:
    build: .
    container_name: bookhaven
    ports:
      - "8097:8097"
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - H:/Books:/books:rw
      - ./.env:/app/.env:ro
      - ./templates:/app/templates:ro
      - ./bookhaven.py:/app/bookhaven.py:ro
      - ./config.py:/app/config.py:ro
      - ./database.py:/app/database.py:ro
      - ./scanner.py:/app/scanner.py:ro
      - ./genre_ai.py:/app/genre_ai.py:ro
      - ./media_worker.py:/app/media_worker.py:ro
      - ./static:/app/static:ro
    environment:
      - BOOKHAVEN_PORT=8097
      - BOOKS_ROOT=/books
    restart: unless-stopped
